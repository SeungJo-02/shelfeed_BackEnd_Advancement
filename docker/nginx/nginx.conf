# 운영용 Nginx 리버스 프록시 + TLS 종료
# [외부] ──► nginx:443 (HTTPS) ──► app:8080 (내부 네트워크)
# 인증서: Let's Encrypt (certbot, webroot http-01)

upstream app {
    server app:8080;
    keepalive 32;
}

# ── HTTP(80): ACME 챌린지 + HTTPS 리다이렉트 ────────────────
server {
    listen 80;
    server_name api.shelfeed.co.kr;

    # certbot http-01 챌린지 (반드시 리다이렉트보다 먼저)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외 모든 요청은 HTTPS로
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS(443): TLS 종료 후 app으로 프록시 ──────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name api.shelfeed.co.kr;

    ssl_certificate     /etc/letsencrypt/live/api.shelfeed.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.shelfeed.co.kr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;   # 권장 TLS 설정
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # 업로드 바디 크기 (이미지/파일 업로드 대비)
    client_max_body_size 20m;

    # ── 헬스체크 (로그 제외) ─────────────────────────────────
    location /actuator/health {
        access_log off;
        proxy_pass http://app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 애플리케이션 ─────────────────────────────────────────
    location / {
        proxy_pass http://app;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
