server:
  http_listen_port: 3200

# Spring Boot에서 Zipkin 프로토콜로 트레이스 전송 → Tempo가 수신
distributor:
  receivers:
    zipkin:
      endpoint: 0.0.0.0:9411

# 메모리 사용 최소화 - 로컬 테스트용
ingester:
  trace_idle_period: 10s
  max_block_duration: 2m   # 블록 크기 축소 → compaction 메모리 사용 감소

# 로컬 디스크 저장 (테스트 종료 후 휘발성)
storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal

# 7일 보관 (테스트 후 삭제됨)
compactor:
  compaction:
    block_retention: 168h
