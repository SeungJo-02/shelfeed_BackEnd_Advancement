# Grafana 통합 알람 — 조회수 행 락 경합 탐지
# ①②는 원인을 모르지만 빨리 울리고, ③④는 5분 걸리는 대신 원인을 지목한다.
# 대시보드: shelfeed-view-lock  ·  PromQL 은 mysqld-exporter v0.16.0 / Micrometer 기준 실측 확인
{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "조회수 행 락 경합",
      "folder": "Shelfeed",
      "interval": "1m",
      "rules": [
        {
          "uid": "shelfeed-p99",
          "title": "⓪ 감상글 상세 p99 1초 초과",
          "condition": "C",
          "for": "2m",
          "labels": {
            "severity": "critical",
            "service": "shelfeed",
            "incident": "view-count-row-lock"
          },
          "annotations": {
            "summary": "감상글 상세 p99 {{ $values.B }}초",
            "description": "이 알람만 보면 '이 API가 느리다'로 읽힌다. 하지만 여러 API가 동시에 느려졌는지를 먼저 확인해야 한다 — 공유 자원(커넥션 풀·락) 문제면 알람이 가리킨 곳과 원인이 있는 곳이 다르다.",
            "runbook_url": "docs/blog/조회수-행락-장애-회고.md",
            "__dashboardUid__": "shelfeed-view-lock",
            "__panelId__": "1"
          },
          "noDataState": "OK",
          "execErrState": "Error",
          "isPaused": false,
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "editorMode": "code",
                "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{uri=\"/api/v1/reviews/{reviewId}\"}[1m])))",
                "instant": true,
                "range": false,
                "intervalMs": 15000,
                "maxDataPoints": 43200,
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                }
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                },
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                }
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "type": "query",
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        1
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "B"
                      ]
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    }
                  }
                ],
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                }
              }
            }
          ]
        },
        {
