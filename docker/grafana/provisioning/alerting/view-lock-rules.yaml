            "description": "3분 넘게 커넥션을 못 받고 기다리는 요청이 있습니다. 풀 사이즈를 올리기 전에 대시보드의 'acquire vs usage' 패널을 먼저 보세요 — usage 가 더 크면 풀이 작은 게 아니라 커넥션이 안 돌아오는 것이고, 풀을 늘려도 처리량은 그대로입니다.",
            "runbook_url": "docs/blog/조회수-행락-장애-회고.md",
            "__dashboardUid__": "shelfeed-view-lock",
            "__panelId__": "3"
