name: PR Title Validator

# Conventional Commits 형식 PR 제목 검증
# - feat / fix / refactor / docs / test / chore / ci / style / perf / build / revert
# - 영문 prefix 뒤 콜론 필수, 선택적 scope 허용: feat(search): ...

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  validate:
    name: Validate Conventional Commits title
    runs-on: ubuntu-latest
    steps:
      - name: Lint PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 허용 prefix (Conventional Commits 표준)
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            build
            revert
          # 권장: scope 도 표준화
          scopes: |
            search
            auth
            book
            review
            comment
            member
            feed
            notification
            library
            block
            follow
            report
            deploy
            infra
            test
            docs
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            제목의 subject(콜론 뒤)는 소문자로 시작해야 합니다.
            예: feat(search): ES Nori 형태소 분석기 적용
          wip: true
          validateSingleCommit: false

      - name: Add helpful comment on failure
        if: failure()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-title-validator
          message: |
            ❌ **PR 제목이 Conventional Commits 형식을 따르지 않습니다.**

            올바른 형식:
            ```
            <type>(<scope>): <subject>
            ```

            **예시:**
            - `feat(search): ES Nori 형태소 분석기 적용`
            - `fix(auth): JWT refresh 토큰 만료 시 401 응답`
            - `refactor(book): SearchService 책 검색 로직 분리`
            - `chore(deps): Spring Boot 3.4.3 → 3.5.0 업그레이드`

            허용된 type: `feat`, `fix`, `docs`, `style`, `refactor`, `perf`, `test`, `chore`, `ci`, `build`, `revert`

      - name: Remove helpful comment on success
        if: success()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-title-validator
          delete: true
