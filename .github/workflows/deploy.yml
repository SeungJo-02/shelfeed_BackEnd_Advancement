name: Deploy to EC2

# CI(빌드·테스트) 성공 후에만 배포되도록 게이팅한다.
# main으로의 push는 CI를 트리거하고, CI가 성공으로 끝났을 때만 이 배포가 실행된다.
# (CI 실패 시 또는 PR 브랜치의 CI에는 배포되지 않음)
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# 연속 머지 시 나중 배포가 먼저 끝나면 구버전이 최종 상태로 남는다.
# 앞 배포가 끝날 때까지 기다리게 해서 순서를 지킨다(취소하지 않는다 — 건너뛴 커밋이 생기면 안 된다).
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # CI 결론이 success일 때만 배포 (실패/취소 시 차단)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout (CI가 검증한 정확한 커밋)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 롤백 지점을 남기기 위해 커밋 SHA 태그를 함께 붙인다.
          # latest만 밀어 넣으면 직전 이미지가 dangling이 되어 prune에 지워진다.
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/shelfeed-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/shelfeed-backend:${{ github.event.workflow_run.head_sha }}

      - name: EC2에 설정 파일 복사
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          source: "docker-compose.prod.yml,docker/nginx/nginx.conf,docker/prometheus/prometheus-prod.yml,docker/promtail/config.yml"
          target: /home/ec2-user/app
          strip_components: 0

      - name: EC2 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            cd /home/ec2-user/app
            mv docker/prometheus/prometheus-prod.yml prometheus.yml 2>/dev/null || true
            mv docker/promtail/config.yml promtail-config.yml 2>/dev/null || true
            # nginx.conf는 compose가 ./docker/nginx/nginx.conf로 마운트하므로 그대로 둔다.
            # 비워진 디렉터리만 정리(docker/nginx 보존 — 통째로 rm하면 nginx 설정 유실 → 재생성 시 기동 실패)
            rm -rf docker/prometheus docker/promtail

            # DOCKER_IMAGE는 한 줄만 유지한다. 예전 스크립트는 배포마다 append해서 .env가 계속 자랐다.
            sed -i '/^DOCKER_IMAGE=/d' .env
            echo "DOCKER_IMAGE=${{ secrets.DOCKER_USERNAME }}/shelfeed-backend:latest" >> .env

            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d

            # 배포가 "성공"으로 끝났는데 앱이 죽어 있는 상황을 막는다.
            for i in $(seq 1 40); do
              if docker logs app-app-1 2>&1 | tail -200 | grep -q "Started BackendApplication"; then
                echo "앱 기동 확인"
                docker image prune -f || true
                exit 0
              fi
              if [ "$(docker inspect -f '{{.State.Running}}' app-app-1 2>/dev/null)" != "true" ]; then
                echo "app 컨테이너가 실행 중이 아니다"
                docker logs app-app-1 2>&1 | tail -50
                exit 1
              fi
              sleep 5
            done
            echo "기동 로그를 200초 안에 확인하지 못했다"
            docker logs app-app-1 2>&1 | tail -50
            exit 1
