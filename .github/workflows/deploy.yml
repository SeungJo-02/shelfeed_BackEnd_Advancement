name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/shelfeed-backend:latest

      - name: EC2에 설정 파일 복사
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          source: "docker-compose.prod.yml,docker/nginx/nginx.conf,docker/prometheus/prometheus-prod.yml,docker/promtail/config.yml"
          target: /home/ec2-user/app
          strip_components: 0

      - name: EC2 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ec2-user/app
            mv docker/prometheus/prometheus-prod.yml prometheus.yml 2>/dev/null || true
            mv docker/promtail/config.yml promtail-config.yml 2>/dev/null || true
            # nginx.conf는 compose가 ./docker/nginx/nginx.conf로 마운트하므로 그대로 둔다.
            # 비워진 디렉터리만 정리(docker/nginx 보존 — 통째로 rm하면 nginx 설정 유실 → 재생성 시 기동 실패)
            rm -rf docker/prometheus docker/promtail
            echo "DOCKER_IMAGE=${{ secrets.DOCKER_USERNAME }}/shelfeed-backend:latest" >> .env
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d
            docker image prune -f
