name: Deploy to EC2

# CI(빌드·테스트) 성공 후에만 배포되도록 게이팅한다.
# main으로의 push는 CI를 트리거하고, CI가 성공으로 끝났을 때만 이 배포가 실행된다.
# (CI 실패 시 또는 PR 브랜치의 CI에는 배포되지 않음)
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  # ── 이미지 빌드는 GitHub 러너에서 ───────────────────────────────
  # EC2(t3.medium, 가용 메모리 2GB대)에서 빌드하면 구동 중인 앱과 메모리를 다투게 된다.
  # 빌드는 여기서 끝내고 EC2는 이미지를 받아 띄우기만 한다.
  build:
    name: 이미지 빌드 및 푸시
    runs-on: ubuntu-latest
    # CI 결론이 success일 때만 배포 (실패/취소 시 차단)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout (CI가 검증한 정확한 커밋)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 롤백 지점을 남기기 위해 커밋 SHA 태그를 함께 붙인다.
          # latest만 밀어 넣으면 직전 이미지가 dangling이 되어 prune에 지워진다.
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/shelfeed-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/shelfeed-backend:${{ github.event.workflow_run.head_sha }}

  # ── 배포는 EC2 자체 러너에서 ───────────────────────────────────
  # GitHub 러너에서 SSH로 들어오던 방식은 보안 그룹이 22번 인바운드를 특정 IP로만
  # 열어두고 있어 타임아웃으로 막혔다(호스트 방화벽은 열려 있었다). 러너를 EC2 안에
  # 두면 GitHub로 나가는 아웃바운드 폴링만 쓰므로 인바운드를 열 필요가 없다.
  deploy:
    name: EC2 배포
    needs: build
    runs-on: [self-hosted, shelfeed]

    steps:
      - name: Checkout (CI가 검증한 정확한 커밋)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: 설정 파일 배치
        # compose가 기대하는 파일명·경로로 맞춰 둔다.
        # nginx.conf는 ./docker/nginx/nginx.conf로 마운트되므로 경로를 유지한다.
        run: |
          set -e
          mkdir -p /home/ec2-user/app/docker/nginx
          cp docker-compose.prod.yml            /home/ec2-user/app/
          cp docker/nginx/nginx.conf            /home/ec2-user/app/docker/nginx/
          cp docker/prometheus/prometheus-prod.yml /home/ec2-user/app/prometheus.yml
          cp docker/promtail/config.yml         /home/ec2-user/app/promtail-config.yml

      - name: 배포
        run: |
          set -e
          cd /home/ec2-user/app
          # DOCKER_IMAGE는 한 줄만 유지한다. 예전 스크립트는 배포마다 append해서 .env가 계속 자랐다.
          sed -i '/^DOCKER_IMAGE=/d' .env
          echo "DOCKER_IMAGE=${{ secrets.DOCKER_USERNAME }}/shelfeed-backend:latest" >> .env
          docker-compose -f docker-compose.prod.yml pull
          docker-compose -f docker-compose.prod.yml up -d

      - name: 기동 확인
        # 배포가 "성공"으로 끝났는데 앱이 죽어 있는 상황을 막는다.
        run: |
          set -e
          for i in $(seq 1 40); do
            if docker logs app-app-1 2>&1 | tail -200 | grep -q "Started BackendApplication"; then
              echo "앱 기동 확인"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' app-app-1 2>/dev/null)" != "true" ]; then
              echo "::error::app 컨테이너가 실행 중이 아니다"
              docker logs app-app-1 2>&1 | tail -50
              exit 1
            fi
            sleep 5
          done
          echo "::error::기동 로그를 200초 안에 확인하지 못했다"
          docker logs app-app-1 2>&1 | tail -50
          exit 1

      - name: 이미지 정리
        # 실패해도 배포 자체는 이미 끝난 뒤라 결과를 뒤집지 않는다.
        if: always()
        continue-on-error: true
        run: docker image prune -f
