# EC2 운영용 - 앱 + Redis + 모니터링 (DB는 RDS 사용)

services:
  # ── Reverse Proxy (단일 진입점 80/443 → app:8080, TLS 종료) ──────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro          # 인증서 (certbot이 발급)
      - ./certbot/www:/var/www/certbot:ro           # ACME http-01 챌린지 webroot
    depends_on:
      - app
    # 6시간마다 reload — 갱신된 인증서 무중단 반영
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    restart: unless-stopped

  # ── Let's Encrypt 인증서 발급/자동 갱신 ─────────────────────────
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # 12시간마다 renew 시도 (만료 30일 이내일 때만 실제 갱신)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

  app:
    image: ${DOCKER_IMAGE}
    expose:
      - "8080"          # 외부 직접 노출 제거 — Nginx 경유만 허용
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # 호스트 포트 미노출 — 앱은 컴포즈 내부 네트워크(redis:6379)로만 접근. 외부 도달 차단.
    # REDIS_PASSWORD가 비어 있으면 requirepass ""가 되어 인증 없음(기존 동작 유지). 운영에선 .env에 반드시 설정.
    command: redis-server --requirepass "${REDIS_PASSWORD}" --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}   # redis-cli가 명령줄 노출 없이 인증(healthcheck용)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--enable-feature=native-histograms'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}   # 운영 .env에 강한 값 설정 권장
      GF_USERS_ALLOW_SIGN_UP: false
    ports:
      # localhost 바인딩이 C3의 실질 차단(외부 도달 불가). 접근은 SSH 터널 or nginx 경유만.
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    ports:
      - "127.0.0.1:9100:9100"   # prometheus가 내부망으로 스크랩 — 외부 노출 불필요
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    ports:
      - "127.0.0.1:3100:3100"   # promtail 푸시·grafana 조회 모두 내부망 — 외부 노출 불필요
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.3.2
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  # ── k6 결과 저장소 ───────────────────────────────────────────
  influxdb:
    image: influxdb:1.8
    ports:
      - "8086:8086"
    env_file:
      - .env
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
      INFLUXDB_ADMIN_USER: ${INFLUXDB_ADMIN_USER}
      INFLUXDB_ADMIN_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
    volumes:
      - influxdb-data:/var/lib/influxdb
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  influxdb-data:
