spring:
  config:
    import: "optional:aws-parameterstore:/config/shelfeed/"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20            # RDS(db.t3.micro) max_connections=61의 33% 안전 마진
      minimum-idle: 5
      connection-timeout: 5000         # 5초 — 검색 즉시성, Retry Storm 방지
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000  # 60초 이상 커넥션 점유 시 경고 로그 (풀스캔 모니터링)

  elasticsearch:
    uris: ${ES_URI:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 5s

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  mail:
    properties:
      mail:
        smtp:
          socketFactory:
            port: ${MAIL_PORT:465}
            class: javax.net.ssl.SSLSocketFactory
            fallback: false

# CORS 허용 오리진 — CORS_ALLOWED_ORIGIN 환경변수가 있으면 우선 사용하고,
# 미주입 시에도 운영 프론트 도메인(apex+www)으로 동작하도록 기본값을 명시한다.
# (환경변수 누락 시 localhost로 떨어져 전 API가 차단되던 문제 방지. 콤마 구분 다중 오리진.)
cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:https://shelfeed.co.kr,https://www.shelfeed.co.kr}

# 운영 환경엔 Tempo/Zipkin 인프라가 없으므로 트레이싱 비활성화 (로그 폭주 방지)
management:
  tracing:
    sampling:
      probability: 0
