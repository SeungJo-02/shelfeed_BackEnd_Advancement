spring:
  profiles:
    active: local

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  elasticsearch:
    uris: ${ES_URI:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 5s

  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: ${AWS_ACCESS_KEY:local}
        secret-key: ${AWS_SECRET_KEY:local}
      s3:
        bucket: ${AWS_S3_BUCKET:local-bucket}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          # SMTP 연결/응답/쓰기 타임아웃 — 메일 서버 지연이 요청 스레드를 무한 점유하는 것을 방지
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          ssl:
            enable: ${MAIL_SSL_ENABLE:false}
            trust: ${MAIL_HOST:smtp.gmail.com}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: ${MAIL_STARTTLS_ENABLE:true}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 3600000      # 1시간
  refresh-expiration: 604800000   # 7일

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  default-consumes-media-type: application/json

oauth2:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5173/auth/callback/google}

aladin:
  api:
    ttbkey: ${ALADIN_API_KEY}
    version: "20131101"

clova:
  ocr:
    secret-key: ${CLOVA_OCR_SECRET_KEY}
    api-url: ${CLOVA_OCR_API_URL}

admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    bcc: ${MAIL_BCC:}