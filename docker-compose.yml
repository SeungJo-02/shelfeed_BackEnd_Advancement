# 로컬 개발용 - 인프라 + 모니터링 전체 스택
# AWS EC2 t3.medium (2 vCPU / 4 GiB) 환경 시뮬레이션
# Spring Boot: JAVA_TOOL_OPTIONS="-Xmx1g -Xms512m" ./gradlew bootRun ...

services:
  # ── Database (개발용 / 3307) ────────────────────────────
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: shelfeed
      MYSQL_USER: shelfeed
      MYSQL_PASSWORD: shelfeed
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 512M

  # ── Database (성능 테스트용 / 3308) ──────────────────────
  mysql-perf:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: shelfeed
      MYSQL_USER: shelfeed
      MYSQL_PASSWORD: shelfeed
    ports:
      - "3308:3306"
    volumes:
      - mysql-perf-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.6'      # Spring Boot 1.0 + mysql-perf 0.6 = 1.6 (나머지 0.4는 모니터링)
          memory: 1536M

  # ── Cache ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # 운영과 같은 eviction 정책을 쓴다 — 정책이 갈리면 로컬에서 재현되지 않는 문제가 생긴다.
    # (영속화는 운영에만 둔다. 로컬은 컨테이너를 지워 초기화하는 편이 편하다)
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 256M

  # ── Monitoring ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.2.0
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 512M

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - influxdb
      - loki
      - tempo
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 512M

  # ── Distributed Tracing (Zipkin 프로토콜 수신) ─────────
  tempo:
    image: grafana/tempo:2.3.1
    command: ["-config.file=/etc/tempo.yaml"]
    environment:
      - GOMEMLIMIT=800MiB   # Go GC 강제 발동 임계치 — hard limit(1G) 도달 전 메모리 회수
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/tmp/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API (Grafana 조회)
      - "9411:9411"   # Zipkin 호환 수신 포트
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 1G

  loki:
    image: grafana/loki:3.3.2
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 256M

  promtail:
    image: grafana/promtail:3.3.2
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/promtail/config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M

  node-exporter:
    image: prom/node-exporter:v1.8.2
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 64M

  # ── k6 결과 저장소 ─────────────────────────────────────
  # 부하 테스트(300+ VU) 시 메트릭 쓰기 + Grafana 쿼리 동시 처리 → 0.2 CPU / 512M로는 OOM 발생
  # → 1.0 CPU / 2G로 증설 (k6 점진 부하 한계 측정 시 안정 동작 확보)
  influxdb:
    image: influxdb:1.8
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: k6
    volumes:
      - influxdb-data:/var/lib/influxdb
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  # ── Elasticsearch (도서 검색 색인 — 풀스캔 → 역인덱스) ────
  #   Nori 플러그인 포함 (docker/elasticsearch/Dockerfile)
  elasticsearch:
    build:
      context: .
      dockerfile: docker/elasticsearch/Dockerfile
    container_name: backend_project-elasticsearch-1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false        # 로컬 측정용 — 운영은 활성화 필수
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1.5G

  # ── Kibana (ES 색인·검색 디버깅 UI) ────────────────────────
  kibana:
    image: kibana:8.11.3
    container_name: backend_project-kibana-1
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_PUBLICBASEURL=http://localhost:5601
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 768M

volumes:
  mysql-data:
  mysql-perf-data:
  grafana-data:
  influxdb-data:
  tempo-data:
  elasticsearch-data:
